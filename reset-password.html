<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | Teengro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e1b4b, #020617 60%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    }

    .brand {
      text-align: center;
      font-weight: 700;
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    h2 {
      text-align: center;
      margin: 0 0 6px;
      font-size: 1.2rem;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 22px;
    }

    label {
      font-size: 0.85rem;
      color: #cbd5f5;
      margin-bottom: 6px;
      display: block;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      background: #020617;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
      transition: border 0.2s ease;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .msg {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .msg.success {
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      border: 1px solid rgba(34,197,94,0.3);
    }

    .msg.error {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">Teengro</div>
    <h2>Reset password</h2>
    <div class="subtitle">Choose a new password for your account</div>

    <label for="password">New password</label>
    <input type="password" id="password" placeholder="At least 6 characters" />

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" placeholder="Re-enter password" />

    <button onclick="resetPassword()">Update password</button>

    <div id="msg" class="msg"></div>

    <div class="footer">
      © Teengro • Secure password reset
    </div>
  </div>

  <script src="reset-password.js"></script>
</body>
</html>
